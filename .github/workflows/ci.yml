name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2

    # 先下载依赖，再修改 Cargo Registry
    - name: Fetch and patch dependencies
      shell: pwsh
      run: |
          $cargoHome = $env:CARGO_HOME
          if (-not $cargoHome) {
            $cargoHome = Join-Path $env:USERPROFILE '.cargo'
          }

          cargo fetch --locked

          & "$env:GITHUB_WORKSPACE\tools\slint-winit-patch\apply.ps1" `
            -CargoHome $cargoHome

    - name: Build
      run: cargo build --release --locked

    # 打包可分发布局：exe 旁必须带 assets/tray-icons（运行时按 exe 目录搜索链
    # 加载托盘图标，见 src/main.rs start_tray；只上传裸 exe 会因找不到图标
    # 直接跳过托盘创建——无托盘即无法打开面板，程序等于不可用）。
    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path dist | Out-Null
        Copy-Item target/release/twinkle-tray-rust.exe dist/
        New-Item -ItemType Directory -Path dist/assets | Out-Null
        Copy-Item -Recurse assets/tray-icons dist/assets/tray-icons
        Copy-Item LICENSE dist/
        Compress-Archive -Path dist/* -DestinationPath twinkle-tray-rust-x64.zip -Force

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.0
      with:
        name: twinkle-tray-rust-x64
        path: twinkle-tray-rust-x64.zip
