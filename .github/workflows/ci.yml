name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2

    # 先下载依赖，再修改 Cargo Registry
    - name: Fetch and patch dependencies
      shell: pwsh
      run: |
          $cargoHome = $env:CARGO_HOME
          if (-not $cargoHome) {
            $cargoHome = Join-Path $env:USERPROFILE '.cargo'
          }

          cargo fetch --locked

          & "$env:GITHUB_WORKSPACE\tools\slint-winit-patch\apply.ps1" `
            -CargoHome $cargoHome

    - name: Build
      run: cargo build --release --locked

    # build.rs 已把 assets/tray-icons 复制到 target/release/assets（运行时托盘
    # 图标按 exe 目录搜索链加载，见 src/main.rs start_tray），构建产物目录
    # 即为可分发布局；此处直接把 exe + assets + LICENSE 压包上传即可。
    - name: Package zip
      shell: pwsh
      run: Compress-Archive -Path target/release/twinkle-tray-rust.exe,target/release/assets,LICENSE -DestinationPath twinkle-tray-rust-x64.zip -Force

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.0
      with:
        name: twinkle-tray-rust-x64
        path: twinkle-tray-rust-x64.zip
